# Local development server. Keep data outside the extracted bundle:
# RedisService run --foreground -c "$env:PI_CODING_AGENT_DIR\redis.local.conf" --dir D:\redis-data
bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
loglevel notice
logfile ""
databases 16

# RedisService's --dir selects the data directory. Do not set dir here:
# Redis applies config directives before command-line overrides.
# For direct redis-server execution, start in your data folder.
# SHUTDOWN SAVE saves the latest data before exiting.
dbfilename dump.rdb
save 60 1
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
appendonly no
